<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Архитектор будущего">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3346"/>
      <stop offset="1" stop-color="#061620"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="55%" r="70%">
      <stop offset="0" stop-color="#58e1f2" stop-opacity=".42"/>
      <stop offset="1" stop-color="#58e1f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="70%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58e1f2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#58e1f2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="132" y="88" width="76" height="58" rx="21"/></clipPath>
  </defs>
  <circle cx="120" cy="120" r="112" fill="#0e1828"/>
  <circle cx="120" cy="120" r="112" fill="url(#halo)"/>
  <circle cx="120" cy="120" r="112" fill="none" stroke="#d6b276" stroke-width="3"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#d6b276" stroke-width="1" stroke-dasharray="2 6" opacity=".55"/>

  <!-- левое стекло: обычный взгляд -->
  <rect x="32" y="88" width="76" height="58" rx="21" fill="#0b1422"/>
  <path d="M48 104 L60 96 M48 116 L72 100" stroke="#eef1f4" stroke-width="2.4" stroke-linecap="round" opacity=".35"/>

  <!-- правое стекло: город и чертёж будущего -->
  <rect x="132" y="88" width="76" height="58" rx="21" fill="url(#lens)"/>
  <g clip-path="url(#clip)">
    <rect x="132" y="88" width="76" height="58" fill="url(#glow)"/>
    <g stroke="#58e1f2" stroke-width=".7" opacity=".35">
      <line x1="132" y1="100" x2="208" y2="100"/><line x1="132" y1="112" x2="208" y2="112"/><line x1="132" y1="124" x2="208" y2="124"/>
      <line x1="146" y1="88" x2="146" y2="146"/><line x1="160" y1="88" x2="160" y2="146"/><line x1="174" y1="88" x2="174" y2="146"/><line x1="188" y1="88" x2="188" y2="146"/>
    </g>
    <path d="M132 138 L139 138 L139 128 L145 128 L145 120 L151 120 L151 131 L157 131 L157 106 L161 106 L161 100 L165 100 L165 106 L169 106 L169 126 L175 126 L175 114 L182 114 L182 130 L188 130 L188 121 L195 121 L195 133 L208 133"
          fill="none" stroke="#58e1f2" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="163" y1="92" x2="163" y2="100" stroke="#58e1f2" stroke-width="1.6"/>
    <line x1="132" y1="141" x2="208" y2="141" stroke="#58e1f2" stroke-width="1.2" opacity=".7"/>
    <circle cx="178" cy="104" r="9" fill="none" stroke="#d6b276" stroke-width="1.8"/>
    <line x1="178" y1="91" x2="178" y2="117" stroke="#d6b276" stroke-width="1.1"/>
    <line x1="165" y1="104" x2="191" y2="104" stroke="#d6b276" stroke-width="1.1"/>
  </g>

  <!-- оправа -->
  <rect x="32" y="88" width="76" height="58" rx="21" fill="none" stroke="#eef1f4" stroke-width="8"/>
  <rect x="132" y="88" width="76" height="58" rx="21" fill="none" stroke="#eef1f4" stroke-width="8"/>
  <path d="M108 106 C114 98 126 98 132 106" fill="none" stroke="#eef1f4" stroke-width="7" stroke-linecap="round"/>
  <path d="M32 104 L20 100 M208 104 L220 100" stroke="#eef1f4" stroke-width="7" stroke-linecap="round"/>
  <path d="M212 120 L226 124 M211 132 L223 140" stroke="#58e1f2" stroke-width="2" stroke-linecap="round" opacity=".8"/>
</svg>
